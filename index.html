<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3a3e44">
<title>Rolador de Dados</title>
<link rel="stylesheet" href="css/estilo.css?v=16">
</head>
<body>
<div class="app">
  <!-- ===== BARRA DE CIMA: menu (☰) + abas só com ícones ===== -->
  <header class="barra-app">
    <button class="icone" id="abrir-menu" aria-label="Menu"><i data-icone="menu"></i></button>
    <nav class="abas" role="tablist">
      <button data-aba="dados" class="ativa" aria-label="Dados (simples)" title="Simples"><i data-icone="hexagono"></i></button>
      <button data-aba="avancado" aria-label="Dados (avançado)" title="Avançado"><i data-icone="avancado"></i></button>
      <button data-aba="favoritos" aria-label="Favoritos" title="Favoritos"><i data-icone="coracao"></i></button>
      <button data-aba="historico" aria-label="Histórico" title="Histórico"><i data-icone="historico"></i></button>
      <button data-aba="fichas" aria-label="Fichas" title="Fichas"><i data-icone="ficha"></i></button>
      <button data-aba="combate" aria-label="Combate" title="Combate"><i data-icone="espadas"></i><span class="selo-aba" id="selo-rodada" hidden></span></button>
    </nav>
  </header>

  <!-- ===== ABAS SIMPLES E AVANÇADO: a calculadora (mesmo visor, teclados diferentes) ===== -->
  <main class="tela tela-calc" id="tela-dados">
    <section class="display">
      <div class="resultado" id="resultado" aria-live="polite">
      </div>
      <div class="visor">
        <input id="expr" type="text" inputmode="text" autocomplete="off" autocapitalize="off"
               autocorrect="off" spellcheck="false" placeholder="" aria-label="Expressão">
        <button id="apagar-tecla" aria-label="Apagar o último"><i data-icone="backspace"></i></button>
      </div>
      <div class="previa" id="previa"></div>
    </section>

    <!-- Teclado SIMPLES: dados em blocos + números -->
    <div class="teclado" id="teclado-simples">
      <div class="grade-dados quatro">
        <button data-dado="100">d100</button>
        <button data-dado="20">d20</button>
        <button data-dado="12">d12</button>
        <button data-dado="10">d10</button>
      </div>
      <div class="grade-dados cinco">
        <button data-dado="8">d8</button>
        <button data-dado="6">d6</button>
        <button data-dado="4">d4</button>
        <button data-dado="3">d3</button>
        <button data-dado="2">d2</button>
      </div>
      <div class="numeros tres">
        <button data-tecla="7">7</button><button data-tecla="8">8</button><button data-tecla="9">9</button>
        <button data-tecla="4">4</button><button data-tecla="5">5</button><button data-tecla="6">6</button>
        <button data-tecla="1">1</button><button data-tecla="2">2</button><button data-tecla="3">3</button>
        <button data-op="−">-</button><button data-tecla="0">0</button><button data-op="+">+</button>
      </div>
    </div>

    <!-- Teclado AVANÇADO: mais dados + operadores -->
    <div class="teclado" id="teclado-avancado" hidden>
      <div class="grade-dados cinco">
        <button data-acao="d" class="dn" aria-label="Dado de qualquer tamanho">dN</button>
        <button data-dado="100">d100</button>
        <button data-dado="20">d20</button>
        <button data-dado="12">d12</button>
        <button data-dado="10">d10</button>
      </div>
      <div class="grade-dados seis">
        <button data-dado="8">d8</button>
        <button data-dado="6">d6</button>
        <button data-dado="4">d4</button>
        <button data-dado="3">d3</button>
        <button data-dado="2">d2</button>
        <button data-acao="vantagem" class="vant" aria-label="Vantagem">Vant</button>
      </div>
      <div class="numeros seis">
        <button data-tecla="1">1</button><button data-tecla="2">2</button><button data-tecla="3">3</button>
        <button data-tecla="4">4</button><button data-tecla="5">5</button><button data-tecla="6">6</button>
        <button data-tecla="7">7</button><button data-tecla="8">8</button><button data-tecla="9">9</button>
        <button data-tecla="0">0</button><button data-op="−">-</button><button data-op="+">+</button>
        <button data-abre="(">(</button><button data-fecha=")">)</button><button data-abre="[">[</button>
        <button data-fecha="]">]</button><button data-op="×">×</button><button data-acao="desvantagem" class="pequeno">Desv</button>
        <button data-texto="kh" class="pequeno">kh</button><button data-texto="kl" class="pequeno">kl</button>
        <button data-texto=": " class="pequeno">:</button><button data-texto="; " class="pequeno">;</button>
        <button data-acao="limpar" class="pequeno">C</button><button data-acao="apagar" aria-label="Apagar"><i data-icone="backspace"></i></button>
      </div>
    </div>

    <div class="barra-rolar">
      <button class="icone" id="limpar-visor" aria-label="Limpar"><i data-icone="limpar"></i></button>
      <button class="rolar" id="rolar">ROLAR</button>
      <button class="icone cheio" id="salvar-favorito" aria-label="Salvar nos favoritos"><i data-icone="coracao"></i></button>
    </div>
  </main>

  <!-- ===== ABA FAVORITOS: agrupados (por personagem, por exemplo) ===== -->
  <main class="tela" id="tela-favoritos" hidden>
    <div class="lista-cartoes" id="lista-favoritos"></div>
    <button class="fab" id="novo-favorito" aria-label="Novo favorito"><i data-icone="mais"></i></button>
  </main>

  <!-- ===== ABA HISTÓRICO ===== -->
  <main class="tela" id="tela-historico" hidden>
    <div class="lista-cartoes" id="lista-historico"></div>
  </main>

  <!-- ===== ABA FICHAS: personagens e monstros ===== -->
  <main class="tela" id="tela-fichas" hidden>
    <!-- A busca só aparece quando há muitas fichas -->
    <div class="barra" id="barra-busca" hidden>
      <input id="busca" type="search" placeholder="Buscar ficha" aria-label="Buscar ficha">
    </div>
    <div class="lista-fichas" id="lista-fichas"></div>
    <button class="fab" id="nova-ficha" aria-label="Nova ficha"><i data-icone="mais"></i></button>
  </main>

  <!-- ===== ABA COMBATE: ordem de iniciativa, turnos e PV de cada um ===== -->
  <main class="tela" id="tela-combate" hidden>
    <div class="combate-cabeca" id="combate-cabeca">
      <div class="rodada"><small>Rodada</small><b id="rodada-num">—</b></div>
      <div class="vez-de"><small id="vez-rotulo">Vez de</small><b id="vez-nome"></b></div>
      <button class="icone" id="rolar-iniciativas" aria-label="Rolar iniciativa" title="Rolar iniciativa"><i data-icone="dado"></i></button>
      <button class="icone" id="encerrar-combate" aria-label="Encerrar combate" title="Encerrar combate"><i data-icone="lixeira"></i></button>
    </div>
    <div class="lista-combate" id="lista-combate"></div>
    <button class="fab" id="add-combatente" aria-label="Adicionar ao combate"><i data-icone="mais"></i></button>
    <div class="combate-turno" id="combate-turno">
      <button class="icone" id="turno-anterior" aria-label="Voltar um turno"><i data-icone="voltar"></i></button>
      <button class="rolar" id="proximo-turno">PRÓXIMO TURNO</button>
    </div>
  </main>
</div>

<!-- ===== MENU LATERAL (☰) ===== -->
<div class="gaveta-fundo" id="gaveta" hidden>
  <nav class="gaveta" aria-label="Menu">
    <div class="gaveta-cabeca">
      <span class="logo" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 1.8l9 5.1v10.2l-9 5.1-9-5.1V6.9z"/></svg><b>20</b></span>
      <span>Rolador de Dados</span>
    </div>
    <button data-menu="config"><i data-icone="engrenagem"></i>Configurações</button>
    <button data-menu="vibrar"><i data-icone="celular"></i>Vibração<span class="estado-menu" id="estado-vibrar"></span></button>
    <button data-menu="exportar"><i data-icone="baixar"></i>Exportar backup</button>
    <button data-menu="importar"><i data-icone="enviar"></i>Importar backup</button>
    <button data-menu="compartilhar"><i data-icone="compartilhar"></i>Compartilhar</button>
    <button data-menu="ajuda"><i data-icone="ajuda"></i>Ajuda</button>
    <button data-menu="sobre"><i data-icone="info"></i>Sobre</button>
  </nav>
</div>

<!-- ===== FICHA ABERTA (tela cheia) ===== -->
<section class="tela-cheia" id="ficha" hidden>
  <header class="topo">
    <button class="icone" id="ficha-voltar" aria-label="Voltar"><i data-icone="voltar"></i></button>
    <h1 id="ficha-titulo"></h1>
    <button class="icone" id="ficha-editar" aria-label="Editar"><i data-icone="lapis"></i></button>
  </header>
  <div class="ficha-corpo" id="ficha-corpo"></div>
  <div class="ficha-resultado" id="ficha-resultado" hidden>
    <div class="resultado-botoes">
      <button class="icone" id="recolher-resultado" aria-label="Recolher detalhes" aria-expanded="true"><i data-icone="seta"></i></button>
      <button class="icone" id="fechar-resultado" aria-label="Fechar resultado"><i data-icone="fechar"></i></button>
    </div>
    <div id="ficha-resultado-conteudo"></div>
  </div>
</section>

<!-- ===== EDITOR DE FICHA (tela cheia) ===== -->
<section class="tela-cheia" id="editor" hidden>
  <header class="topo">
    <button class="icone" id="editor-cancelar" aria-label="Cancelar"><i data-icone="fechar"></i></button>
    <h1 id="editor-titulo">Nova ficha</h1>
    <button class="botao destaque" id="editor-salvar">Salvar</button>
  </header>
  <form class="editor-corpo" id="editor-form" autocomplete="off">
    <!-- Toque na imagem para escolher outra (galeria ou câmera) -->
    <div class="editor-imagem">
      <label class="retrato-escolher" for="ed-arquivo" aria-label="Escolher imagem">
        <div class="retrato grande" id="ed-retrato"></div>
        <span class="selo-camera"><i data-icone="camera"></i></span>
      </label>
      <input id="ed-arquivo" type="file" accept="image/*" hidden>
      <div class="coluna">
        <label class="campo-mini">Emoji (opcional) <input id="ed-emoji" maxlength="4"></label>
        <button type="button" class="botao-texto" id="ed-remover-imagem">Remover imagem</button>
      </div>
    </div>
    <label>Nome <input id="ed-nome" required></label>
    <div class="linha-campos">
      <label>Tipo
        <select id="ed-tipo">
          <option value="personagem">Personagem</option>
          <option value="monstro">Monstro</option>
        </select>
      </label>
      <label>CA <input id="ed-ca" type="number" inputmode="numeric"></label>
      <label>PV máx. <input id="ed-pv" type="number" inputmode="numeric"></label>
    </div>
    <label>Descrição <input id="ed-subtitulo" placeholder="Ex.: Guerreira nível 3 · ou · ND 5 Gigante"></label>
    <label>Notas <textarea id="ed-notas" rows="3"></textarea></label>

    <h2>Rolagens</h2>
    <div id="ed-rolagens"></div>
    <button type="button" class="botao" id="ed-adicionar">+ Adicionar rolagem</button>

    <h2>Usos e recargas</h2>
    <div id="ed-recursos"></div>
    <button type="button" class="botao" id="ed-adicionar-recurso">+ Adicionar uso</button>

    <p class="aviso" id="ed-aviso"></p>
    <div class="editor-acoes">
      <button type="button" class="botao" id="ed-duplicar">Duplicar</button>
      <button type="button" class="botao perigo" id="ed-apagar">Apagar ficha</button>
    </div>
  </form>
</section>

<!-- ===== PAINEL (folha que sobe): Configurações, favorito, ajuda, adicionar ao combate ===== -->
<div class="painel" id="painel" hidden>
  <div class="folha">
    <header class="topo">
      <h1 id="painel-titulo">Histórico</h1>
      <button class="icone" id="fechar-painel" aria-label="Fechar"><i data-icone="fechar"></i></button>
    </header>
    <div class="folha-corpo" id="painel-corpo"></div>
  </div>
</div>

<input type="file" id="arquivo-backup" accept="application/json,.json" hidden>

<!-- A ordem importa: dados e lógica primeiro, a interface por último. -->
<script src="js/temas.js?v=16"></script>
<script src="js/monstros.js?v=16"></script>
<script src="js/logica.js?v=16"></script>
<script src="js/app.js?v=16"></script>
</body>
</html>
